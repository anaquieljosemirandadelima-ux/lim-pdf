name: Dependency refresh

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/hardening-completo-lim-pdf
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: read

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install security-fixed runtime dependencies
        run: npm install next@16.3.0 pdfjs-dist@^6.2.108 --save

      - name: Align Next.js ESLint config
        run: npm install --save-dev eslint-config-next@16.3.0

      - name: Apply compatible audit fixes
        run: npm audit fix

      - name: Verify all dependencies
        run: npm audit --audit-level=high

      - name: Verify production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload refreshed manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-dependency-manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
