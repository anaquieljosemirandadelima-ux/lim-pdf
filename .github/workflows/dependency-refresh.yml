name: Dependency refresh

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/hardening-completo-lim-pdf
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install security-fixed runtime dependencies
        run: npm install next@16.3.0 pdfjs-dist@^6.2.108 --save

      - name: Align Next.js ESLint config
        run: npm install --save-dev eslint-config-next@16.3.0

      - name: Apply compatible audit fixes
        run: npm audit fix

      - name: Narrow PDF.js text item type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/components/PdfEditorWorkspaceHardened.tsx")
          text = path.read_text()
          old = "const textItems = content.items.filter(isTextContentItem);"
          new = "const textItems = content.items.filter(isTextContentItem) as TextContentItem[];"
          if old not in text and new not in text:
              raise SystemExit("expected PDF.js text-items expression not found")
          path.write_text(text.replace(old, new))
          PY

      - name: Verify all dependencies
        run: npm audit --audit-level=high

      - name: Verify production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit audited fixes
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/components/PdfEditorWorkspaceHardened.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix: finalize audited dependency and PDF.js typing updates"
            git push origin HEAD:agent/hardening-completo-lim-pdf
          fi

      - name: Upload refreshed manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-dependency-manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
