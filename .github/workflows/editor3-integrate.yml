      - name: Commit Editor 3.0
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PdfEditorStudio.tsx src/components/PdfEditorWorkspaceHardened.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Integra Editor PDF 3.0 [editor3-integrated]"
            git push origin HEAD:release-top-ux-adsense-seo-20260811
          fi
