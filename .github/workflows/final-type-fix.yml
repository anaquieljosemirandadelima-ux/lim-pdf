name: Final type fix

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/hardening-completo-lim-pdf
    paths:
      - .github/workflows/final-type-fix.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Apply PDF.js and BlobPart type fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          editor = Path("src/components/PdfEditorWorkspaceHardened.tsx")
          text = editor.read_text()
          text = text.replace("          await document.destroy();\n", "")
          text = text.replace("        try { await sanitizeDocument.destroy(); } catch { /* no-op */ }\n", "")
          editor.write_text(text)

          render = Path("src/lib/pdf-render.ts")
          text = render.read_text().replace("    await document.destroy();\n", "")
          render.write_text(text)

          browser = Path("src/lib/browser-files.ts")
          text = browser.read_text()
          old = "    localParts.push(localHeader, entry.data);"
          first = "    localParts.push(Uint8Array.from(localHeader).buffer, Uint8Array.from(entry.data).buffer);"
          second = "    localParts.push(Uint8Array.from(localHeader).buffer, entry.data);"
          if text.count(old) != 2:
              raise SystemExit(f"expected 2 localParts patterns, found {text.count(old)}")
          text = text.replace(old, first, 1)
          text = text.replace(old, second, 1)
          old_return = "  return new Blob([...localParts, ...centralParts, zipEnd(entries.length, centralSize, offset)], { type: \"application/zip\" });"
          new_return = "  return new Blob([...localParts, ...centralParts.map((part) => Uint8Array.from(part).buffer), Uint8Array.from(zipEnd(entries.length, centralSize, offset)).buffer], { type: \"application/zip\" });"
          if text.count(old_return) != 2:
              raise SystemExit(f"expected 2 ZIP return patterns, found {text.count(old_return)}")
          text = text.replace(old_return, new_return)
          browser.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Full project check
        run: npm run check

      - name: Commit validated type fixes
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PdfEditorWorkspaceHardened.tsx src/lib/pdf-render.ts src/lib/browser-files.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix: align PDF and ZIP types with upgraded toolchain"
            git push origin HEAD:agent/hardening-completo-lim-pdf
          fi
