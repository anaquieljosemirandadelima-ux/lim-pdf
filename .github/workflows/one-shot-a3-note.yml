name: One Shot A3 Note

on:
  push:
    branches:
      - pro-suite-ocr-editor-20260810

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pro-suite-ocr-editor-20260810
          fetch-depth: 0
      - name: Add certificate compatibility note
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/ProPdfWorkspace.tsx')
          s = p.read_text()
          old = '<Info title="Chave não sai do navegador">O Web Crypto assina localmente e o PDF recebe um contêiner CMS destacado.</Info>'
          new = '<Info title="Chave não sai do navegador">O Web Crypto assina localmente e o PDF recebe um contêiner CMS destacado. Certificados A1 podem ser usados quando a chave/certificado estiverem disponíveis em PEM; tokens/cartões A3 exigem ponte nativa ou extensão porque páginas web comuns não recebem acesso direto ao dispositivo criptográfico.</Info>'
          if old in s:
            s = s.replace(old, new)
          p.write_text(s)
          PY
          rm -f .github/workflows/one-shot-a3-note.yml
      - run: |
          npm ci --no-audit --no-fund
          npm run lint
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Explica compatibilidade A1 e limite de tokens A3"
          git push origin HEAD:pro-suite-ocr-editor-20260810
