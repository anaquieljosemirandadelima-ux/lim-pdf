name: One Shot Batch Filter

on:
  push:
    branches:
      - pro-suite-ocr-editor-20260810

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pro-suite-ocr-editor-20260810
          fetch-depth: 0
      - name: Ignore non-PDF files when selecting a batch folder
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/ProPdfWorkspace.tsx')
          s = p.read_text()
          old = 'const selected = validateSelection(Array.from(list));'
          new = 'const candidates = tool.slug === "processamento-lote-pdf" ? Array.from(list).filter((file) => file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")) : Array.from(list);\n      const selected = validateSelection(candidates);'
          if old in s and 'const candidates = tool.slug === "processamento-lote-pdf"' not in s:
            s = s.replace(old, new)
          p.write_text(s)
          PY
          rm -f .github/workflows/one-shot-batch-filter.yml
      - run: |
          npm ci --no-audit --no-fund
          npm run lint
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Ignora arquivos não PDF em pastas de lote"
          git push origin HEAD:pro-suite-ocr-editor-20260810
