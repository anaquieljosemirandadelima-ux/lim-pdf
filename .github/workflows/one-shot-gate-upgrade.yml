name: One Shot Gate Upgrade

on:
  push:
    branches:
      - pro-suite-ocr-editor-20260810

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pro-suite-ocr-editor-20260810
          fetch-depth: 0
      - name: Remove preliminary gate and auto-merge
        run: |
          rm -f .github/workflows/pro-suite-release-gate.yml .github/workflows/pro-suite-auto-merge.yml .github/workflows/one-shot-gate-upgrade.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Adota gate definitivo da suíte profissional"
          git push origin HEAD:pro-suite-ocr-editor-20260810
