name: One Shot Form Label Fix

on:
  push:
    branches:
      - pro-suite-ocr-editor-20260810

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pro-suite-ocr-editor-20260810
          fetch-depth: 0
      - name: Fix signature field wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/ProPdfWorkspace.tsx')
          s = p.read_text().replace('<option value="signature">Assinatura visual</option>', '<option value="signature">Campo de assinatura digital</option>')
          p.write_text(s)
          PY
          rm -f .github/workflows/one-shot-label-fix.yml
      - run: |
          npm ci --no-audit --no-fund
          npm run lint
      - name: Commit and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Corrige terminologia do campo de assinatura"
          git push origin HEAD:pro-suite-ocr-editor-20260810
