name: One Shot Optimize Preserve

on:
  push:
    branches:
      - pro-suite-ocr-editor-20260810

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pro-suite-ocr-editor-20260810
          fetch-depth: 0
      - name: Preserve outlines and catalog-level structures
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/pro-pdf-optimize.ts')
          s = p.read_text()
          s = s.replace('import { PDFDocument } from "pdf-lib";', 'import { PDFDocument, PDFName } from "pdf-lib";')
          old = '    let bytes: Uint8Array;\n    let garbageCollected = false;\n    if (fields === 0) {'
          new = '''    const catalogStructures = ["Outlines", "Names", "StructTreeRoot", "OCProperties", "PageLabels", "OpenAction", "AcroForm"].filter((name) => Boolean(source.catalog.get(PDFName.of(name))));
    const canRebuildPagesOnly = fields === 0 && catalogStructures.length === 0;
    let bytes: Uint8Array;
    let garbageCollected = false;
    if (canRebuildPagesOnly) {'''
          if old in s:
            s = s.replace(old, new)
          old_report = 'garbageCollected ? "Objetos não alcançáveis foram descartados ao reconstruir somente páginas e dependências referenciadas." : "Formulários interativos foram preservados; a limpeza de objetos não alcançáveis foi limitada para não quebrar o AcroForm.",'
          new_report = 'garbageCollected ? "Objetos não alcançáveis foram descartados ao reconstruir somente páginas e dependências referenciadas." : `Estruturas de documento foram preservadas (${catalogStructures.join(", ") || "formulário interativo"}); a coleta agressiva foi evitada para não remover navegação ou acessibilidade.`, '
          if old_report in s:
            s = s.replace(old_report, new_report)
          p.write_text(s)
          PY
          rm -f .github/workflows/one-shot-optimize-preserve.yml
      - run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preserva bookmarks e estruturas de documento na otimização"
          git push origin HEAD:pro-suite-ocr-editor-20260810
