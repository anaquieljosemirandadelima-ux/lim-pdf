name: Pro Links Patch

on:
  push:
    branches:
      - pro-suite-ocr-editor-20260810

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[links-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pro-suite-ocr-editor-20260810
          fetch-depth: 0
      - name: Enable link inspection/edit/remove workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          barrel = Path('src/lib/pro-pdf-engines.ts')
          s = barrel.read_text()
          if 'from "@/lib/pro-pdf-links"' not in s:
              s += '\nexport { editHyperlink, readHyperlinks, removeHyperlink, type PdfHyperlinkInfo } from "@/lib/pro-pdf-links";\n'
          barrel.write_text(s)

          route = Path('src/app/ferramentas/[slug]/page.tsx')
          s = route.read_text()
          if 'ProLinksWorkspace' not in s:
              s = s.replace('import { ProNavigationWorkspace } from "@/components/ProNavigationWorkspace";', 'import { ProNavigationWorkspace } from "@/components/ProNavigationWorkspace";\nimport { ProLinksWorkspace } from "@/components/ProLinksWorkspace";')
          s = s.replace('const navigationProTools = new Set<ProToolSlug>(["links-pdf", "bookmarks-pdf"]);', 'const navigationProTools = new Set<ProToolSlug>(["bookmarks-pdf"]);')
          old = 'const Workspace = navigationProTools.has(proTool.slug) ? ProNavigationWorkspace : ProPdfWorkspace;'
          new = 'const Workspace = proTool.slug === "links-pdf" ? ProLinksWorkspace : navigationProTools.has(proTool.slug) ? ProNavigationWorkspace : ProPdfWorkspace;'
          if old in s:
              s = s.replace(old, new)
          route.write_text(s)
          PY
      - run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run build
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/pro-pdf-engines.ts src/app/ferramentas/[slug]/page.tsx
          git commit -m "Permite listar, editar e remover hyperlinks [links-patched]"
          git push origin HEAD:pro-suite-ocr-editor-20260810
