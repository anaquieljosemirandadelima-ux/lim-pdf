name: Pro Suite Complete Gate

on:
  push:
    branches:
      - pro-suite-ocr-editor-20260810
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pro-suite-complete-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Require clean finalized source tree
        shell: bash
        run: |
          shopt -s nullglob
          TEMP=(.github/workflows/*patch*.yml .github/workflows/one-shot-*.yml .github/workflows/pro-suite-finalize.yml)
          if [ ${#TEMP[@]} -ne 0 ]; then
            printf 'Temporary workflow still present: %s\n' "${TEMP[@]}"
            exit 1
          fi
          grep -Fq 'OfficeFidelityWorkspace' 'src/app/ferramentas/[slug]/page.tsx'
          grep -Fq 'ProLinksWorkspace' 'src/app/ferramentas/[slug]/page.tsx'
          grep -Fq 'StudioProDock' 'src/components/PdfEditorStudio.tsx'
          grep -Fq 'limpdf:studio-pro' 'src/components/PdfEditorStudio.tsx'
          grep -Fq 'dataset.limpdfEditorMode !== "studio"' 'src/components/PdfEditorStudio.tsx'
          grep -Fq 'dataset.limpdfEditorMode !== "precise"' 'src/components/PdfEditorWorkspaceHardened.tsx'
          grep -Fq 'preciseMounted' 'src/components/PdfEditorExperienceSwitcher.tsx'
          grep -Fq 'from "@/lib/pro-pdf-compare"' 'src/lib/pro-pdf-engines.ts'
          grep -Fq 'from "@/lib/pro-pdf-scan"' 'src/lib/pro-pdf-engines.ts'
          grep -Fq 'from "@/lib/pro-pdf-links"' 'src/lib/pro-pdf-engines.ts'
          grep -Fq 'from "@/lib/pro-pdf-optimize"' 'src/lib/pro-pdf-engines.ts'
          grep -Fq 'office-fidelity-workspace' 'src/components/OfficeFidelityWorkspace.tsx'
          grep -Fq 'folderInputRef' 'src/components/ProPdfWorkspace.tsx'
          grep -Fq 'Campo de assinatura digital' 'src/components/ProPdfWorkspace.tsx'
          grep -Fq 'reference-sidebar-label' 'src/components/AppSidebar.tsx'
          grep -Fq 'tesseract.js@7.0.0' 'src/lib/pro-pdf-visual.ts'
          grep -Fq 'ETSI.CAdES.detached' 'src/lib/pro-pdf-sign.ts'

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npx tsx scripts/test-studio-source.ts
      - run: npx tsx scripts/test-pades-verify.ts
      - run: npx tsx scripts/test-pro-navigation.ts
      - run: npm run build
      - run: npm run test:perf:build
