name: Install script policy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/hardening-completo-lim-pdf
    paths:
      - .github/workflows/script-policy.yml

permissions:
  contents: write

jobs:
  review-install-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record reviewed install scripts
        run: npm approve-scripts esbuild unrs-resolver

      - name: Verify no install scripts remain pending
        run: npm approve-scripts --allow-scripts-pending

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Full project check
        run: npm run check

      - name: Commit install-script policy
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record reviewed dependency install scripts"
            git push origin HEAD:agent/hardening-completo-lim-pdf
          fi
