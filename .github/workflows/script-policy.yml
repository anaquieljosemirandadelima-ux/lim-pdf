name: Dependency policy audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify reviewed install scripts
        run: npm approve-scripts --allow-scripts-pending

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Full project check
        run: npm run check
