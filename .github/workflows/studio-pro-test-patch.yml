name: Studio Pro Test Patch

on:
  push:
    branches:
      - pro-suite-ocr-editor-20260810

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[studio-test-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pro-suite-ocr-editor-20260810
          fetch-depth: 0
      - name: Patch test selectors and scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('scripts/test-studio-pro-browser.ts')
          s = p.read_text().replace('page.locator(".studio-canvas-stage,.studio-canvas-area,.studio-page-wrap,.studio-page").filter({ visible: true }).last()', 'page.locator(".studio-canvas-stage:visible,.studio-canvas-area:visible,.studio-page-wrap:visible,.studio-page:visible").last()')
          p.write_text(s)
          package = Path('package.json')
          data = json.loads(package.read_text())
          data['scripts'].setdefault('test:pades-verify', 'tsx scripts/test-pades-verify.ts')
          data['scripts'].setdefault('test:pro-navigation', 'tsx scripts/test-pro-navigation.ts')
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
      - run: |
          npm ci --no-audit --no-fund
          npm run lint
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-studio-pro-browser.ts package.json
          git commit -m "Corrige homologação do Studio Pro [studio-test-fixed]"
          git push origin HEAD:pro-suite-ocr-editor-20260810
