name: Validate LIM PDF

on:
  push:
    branches:
      - main
      - premium-suite-v2-20260810
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install and refresh lock
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit and PDF tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit refreshed lock on branch pushes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sincroniza package-lock"
          git push
