name: Validate LIM PDF

on:
  push:
    branches:
      - main
      - premium-suite-v2-20260810
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install and refresh lock
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit and PDF tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Upload refreshed lock
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
          retention-days: 1
